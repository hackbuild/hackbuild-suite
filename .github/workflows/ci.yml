name: ci
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  house-rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm install -g npm@11.21.0
      - run: npm ci
      - run: node tools/check-likeness.mjs --no-dist
      - run: node tools/llms.mjs --check && node tools/check-readme.mjs
      - run: node --test tools/test/*.test.mjs
      - run: git ls-files -z | grep -zEv '\.(png|jpe?g|gif|webp|glb|gltf|bin|wasm|onnx|wav|ico|woff2?|ttf)$|^(LICENSES/|RULES.md|CLAUDE.md|tools/)|package-lock.json|Cargo.lock' | xargs -0 node tools/lint-voice.mjs
      - run: node tools/lint-commits.mjs
        env:
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm install -g npm@11.21.0
      - run: npm ci
      - run: node tools/vendor/pin-ui.mjs --check
      - run: npm run typecheck
      - run: npm run build:all
      - run: npm run size
      - run: npm test
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: test -f Cargo.toml || exit 0
      - run: rustup target add wasm32-unknown-unknown
        if: hashFiles('Cargo.toml') != ''
      - run: cargo fmt --all --check && cargo clippy --workspace --all-targets -- -D warnings && cargo test --workspace
        if: hashFiles('Cargo.toml') != ''
