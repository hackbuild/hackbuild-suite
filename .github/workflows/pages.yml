name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm install -g npm@11.21.0
      # hackbuild-ui and the library packages are vendored as tarballs pinned by commit and sha-256
      - run: node tools/vendor/pin-ui.mjs --check
      - run: npm ci
      - run: node tools/check-likeness.mjs --no-dist
      - run: npm run build:all
      - run: npm run size
      # the hosted build is the site; the single files sit beside it for download
      - run: |
          mkdir -p _site
          cp -R dist/hosted/. _site/
          mkdir -p _site/files
          cp dist/single/index.html _site/files/hackbuild-suite.html
          cp dist/groups/*.html _site/files/
      # no model, asset or weight file ships in the site
      - run: "! find _site -type f | grep -Ei '\\.(glb|gltf|vrm|fbx|bvh|pmx|pmd|wav|bin|onnx|safetensors|gguf)$'"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
